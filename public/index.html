<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Monetag Site Verification Tag -->
    <meta name="monetag" content="c59ddb312b27e171656d28f9aee7f846">

    <!-- Monetag MultiTag Ad Script -->
    <script src="https://quge5.com/88/tag.min.js" data-zone="301371" async data-cfasync="false"></script>

    <title>Nexis Protocol - Cloud Mining</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        h1, h2, h3 {
            margin-top: 0;
            text-align: center;
        }

        .title {
            color: var(--primary);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background-color: var(--primary);
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-success {
            background-color: var(--success);
        }

        .btn-warning {
            background-color: var(--warning);
            color: #000;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .stat-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .progress-bar {
            width: 100%;
            background-color: #334155;
            border-radius: 8px;
            height: 10px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }

        .hidden {
            display: none;
        }

        #status {
            text-align: center;
            font-size: 14px;
            color: var(--warning);
            margin-top: 10px;
        }

        .announcement {
            background: #0f172a;
            border-left: 4px solid var(--primary);
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Auth Screen -->
    <div id="auth-screen" class="card">
        <h1 class="title">Nexis Protocol</h1>
        <p style="text-align: center; color: var(--text-muted); font-size: 14px;">Next-Gen Cloud Mining</p>
        <div class="input-group">
            <label for="email">Enter Email to Access Dashboard</label>
            <input type="email" id="email" placeholder="user@example.com">
        </div>
        <button class="btn" onclick="login()">Access Dashboard</button>
        <div id="status"></div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard" class="card hidden">
        <h2 class="title">Nexis Dashboard</h2>
        
        <div class="stat-box" style="margin-bottom: 16px;">
            <div class="stat-label">Your Balance</div>
            <div class="stat-value" style="font-size: 28px;" id="disp-balance">0.0000</div>
            <div style="font-size: 12px; color: var(--text-muted);">$NEXIS</div>
        </div>

        <button id="btn-start" class="btn btn-success" onclick="startMining()">Start 12H Session</button>
        <button id="btn-claim" class="btn hidden" onclick="claimTokens()">Claim Tokens</button>
        <button id="btn-ad" class="btn btn-warning" onclick="watchAd()">Watch Ad (+5 $NEXIS Bonus)</button>

        <div id="session-timer" style="text-align: center; margin: 10px 0; font-size: 14px; color: var(--text-muted);"></div>

        <div class="stat-grid">
            <div class="stat-box">
                <div class="stat-label">Mining Rate</div>
                <div class="stat-value" id="disp-rate">2.0/hr</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Ads Watched</div>
                <div class="stat-value" id="ad-count">0/2</div>
            </div>
        </div>

        <div style="margin-top: 20px;">
            <div class="stat-label" style="display: flex; justify-content: space-between;">
                <span>Total Mined</span>
                <span id="disp-progress-text">0 / 10B</span>
            </div>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
        </div>

        <!-- Referral Link Display -->
        <div class="stat-box" style="margin-top: 16px;">
            <div class="stat-label">Your Referral Link</div>
            <div class="stat-value" id="disp-ref-link" style="font-size: 13px; word-break: break-all; margin-bottom: 8px; color: var(--text);">-</div>
            <button class="btn" style="padding: 8px; font-size: 13px; margin-bottom: 0;" onclick="copyReferralLink()">📋 Copy Invite Link</button>
        </div>

        <!-- Announcements Section -->
        <div style="margin-top: 20px;">
            <h3>Announcements</h3>
            <div id="announcements-list"></div>
        </div>

        <!-- Admin Portal Trigger Button -->
        <button id="btn-admin-portal" class="btn hidden" style="margin-top: 20px; background-color: #ef4444;" onclick="showAdminPortal()">🛠 Admin Portal Access</button>

        <button class="btn" style="background-color: #334155; margin-top: 10px;" onclick="logout()">Logout</button>
    </div>

    <!-- Admin Panel Screen -->
    <div id="admin-panel" class="card hidden">
        <h2 class="title" style="color: #ef4444;">Admin Control Panel</h2>
        <div class="input-group">
            <label for="ann-title">Announcement Title</label>
            <input type="text" id="ann-title" placeholder="System Update">
        </div>
        <div class="input-group">
            <label for="ann-content">Content</label>
            <input type="text" id="ann-content" placeholder="Details here...">
        </div>
        <button class="btn" style="background-color: #ef4444;" onclick="postAnnouncement()">Broadcast Announcement</button>
        <button class="btn" style="background-color: #334155;" onclick="hideAdminPortal()">Back to Dashboard</button>
    </div>
</div>

<script>
    let currentUser = null;
    let timerInterval = null;

    // Capture referral code from URL on load and save locally
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const refCode = urlParams.get('ref');
        if (refCode) {
            localStorage.setItem('nexis_ref', refCode);
        }
    });

    async function login() {
        const email = document.getElementById('email').value;
        if (!email) return alert('Please enter an email');

        const referredBy = localStorage.getItem('nexis_ref') || null;
        document.getElementById('status').innerText = 'Authenticating...';

        try {
            const res = await fetch('/api/user/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, referredBy })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error);

            currentUser = data.user;
            document.getElementById('status').innerText = '';

            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');

            updateUI(data);
        } catch (err) {
            document.getElementById('status').innerText = err.message;
        }
    }

    function updateUI(data) {
        document.getElementById('disp-balance').innerText = parseFloat(currentUser.balance).toFixed(4);
        document.getElementById('disp-rate').innerText = `${data.currentRate}/hr`;
        
        // Display full referral link
        const inviteLink = currentUser.referral_code ? `${window.location.origin}/?ref=${currentUser.referral_code}` : 'N/A';
        document.getElementById('disp-ref-link').innerText = inviteLink;

        // Check Admin Status
        if (currentUser.is_admin) {
            document.getElementById('btn-admin-portal').classList.remove('hidden');
        } else {
            document.getElementById('btn-admin-portal').classList.add('hidden');
        }

        // Stats & Halving
        const totalMined = parseFloat(data.stats.total_mined);
        const maxSupply = parseFloat(data.stats.max_supply);
        const pct = ((totalMined / maxSupply) * 100).toFixed(4);
        document.getElementById('progress-fill').style.width = `${pct}%`;
        document.getElementById('disp-progress-text').innerText = `${totalMined.toFixed(0)} / 10B`;

        // Announcements
        const annList = document.getElementById('announcements-list');
        annList.innerHTML = '';
        if (data.announcements && data.announcements.length > 0) {
            data.announcements.forEach(a => {
                annList.innerHTML += `<div class="announcement"><strong>${a.title}</strong><br>${a.content}</div>`;
            });
        } else {
            annList.innerHTML = '<div style="font-size:12px; color:var(--text-muted); text-align:center;">No announcements yet.</div>';
        }

        // Session State
        if (data.activeSession) {
            document.getElementById('btn-start').classList.add('hidden');
            document.getElementById('btn-claim').classList.remove('hidden');
            document.getElementById('ad-count').innerText = `${data.activeSession.ads_watched || 0}/2`;
            startTimer(data.activeSession.start_time);
        } else {
            document.getElementById('btn-start').classList.remove('hidden');
            document.getElementById('btn-claim').classList.add('hidden');
            document.getElementById('session-timer').innerText = 'No active mining session.';
        }
    }

    function copyReferralLink() {
        if (!currentUser || !currentUser.referral_code) return alert('Referral code not available.');
        const inviteLink = `${window.location.origin}/?ref=${currentUser.referral_code}`;
        
        navigator.clipboard.writeText(inviteLink).then(() => {
            alert('Invite link copied to clipboard!');
        }).catch(err => {
            alert('Failed to copy link.');
        });
    }

    function startTimer(startTimeStr) {
        if (timerInterval) clearInterval(timerInterval);
        const startTime = new Date(startTimeStr).getTime();
        const endTime = startTime + (12 * 60 * 60 * 1000);

        timerInterval = setInterval(() => {
            const now = new Date().getTime();
            const distance = endTime - now;

            if (distance < 0) {
                clearInterval(timerInterval);
                document.getElementById('session-timer').innerText = '12H Session Completed! Ready to claim.';
            } else {
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                document.getElementById('session-timer').innerText = `Session ends in: ${hours}h ${minutes}m ${seconds}s`;
            }
        }, 1000);
    }

    async function startMining() {
        if (!currentUser) return;
        const res = await fetch('/api/mine/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: currentUser.id })
        });
        const data = await res.json();
        if (res.ok) {
            login();
        } else {
            alert(data.message || data.error);
        }
    }

    async function claimTokens() {
        if (!currentUser) return;
        const res = await fetch('/api/mine/claim', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: currentUser.id })
        });
        const data = await res.json();
        if (res.ok) {
            alert(data.message);
            login();
        } else {
            alert(data.error);
        }
    }

    async function watchAd() {
        if (!currentUser) return;
        document.getElementById('status').innerText = 'Opening sponsor ad...';

        const adWindow = window.open('https://uplcm.com/4/12113413', '_blank');

        if (!adWindow) {
            document.getElementById('status').innerText = 'Please allow popups to view ads and earn rewards.';
            return;
        }

        try {
            const res = await fetch('/api/mine/watch-ad', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: currentUser.id })
            });
            
            const data = await res.json();
            
            if (res.ok) {
                currentUser.balance = parseFloat(data.newBalance);
                document.getElementById('disp-balance').innerText = parseFloat(currentUser.balance).toFixed(4);
                document.getElementById('ad-count').innerText = `${data.adsWatched}/2`;
                document.getElementById('status').innerText = data.message;
            } else {
                document.getElementById('status').innerText = data.error;
            }
        } catch (err) {
            document.getElementById('status').innerText = 'Error crediting ad reward. Please try again.';
        }
    }

    function showAdminPortal() {
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
    }

    function hideAdminPortal() {
        document.getElementById('admin-panel').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
    }

    async function postAnnouncement() {
        const title = document.getElementById('ann-title').value;
        const content = document.getElementById('ann-content').value;
        if (!title || !content) return alert('Fill in title & content');

        const res = await fetch('/api/admin/announcement', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ adminKey: 'NEXIS_ADMIN_2026', title, content })
        });

        const data = await res.json();
        if (res.ok) {
            alert('Announcement published!');
            document.getElementById('ann-title').value = '';
            document.getElementById('ann-content').value = '';
            hideAdminPortal();
            login();
        } else {
            alert(data.error);
        }
    }

    function logout() {
        currentUser = null;
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('email').value = '';
    }
</script>
</body>
    </html>
