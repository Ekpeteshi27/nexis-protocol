services:
  - type: web
    name: nexis-protocol-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexis-db
          property: connectionString

databases:
  - name: nexis-db
    plan: free
    databaseName: nexis_protocol
    user: nexis_admin
    
